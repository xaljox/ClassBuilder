# Build the Linux x86_64 (.deb) installer with a LOW glibc floor and attach it to
# a GitHub release. The floor is set by the build machine's glibc, so this job
# runs inside an ubuntu:22.04 container (glibc 2.35) -- the produced binary then
# runs on Ubuntu 22.04 / Debian 12 and everything newer. GitHub's runners are
# x86_64, so this needs no local x86_64 machine.
#
# Runs when a RELEASE is published (attaches to that release's tag). A manual
# "Run workflow" button is kept as a fallback to attach the .deb to an already-
# published release (e.g. the existing v3.0) without re-releasing it.
#
# The heavy step is building a static Qt 6.11.1 (~40-60 min) -- it is CACHED, so
# only the first run pays that; later runs reuse it and finish in minutes.
#
# Counterpart of installer/make-deb.sh (which stamps the arch of the box it runs
# on). On the arm64 Pi that make-deb.sh gives the arm64 .deb (glibc 2.38); this
# workflow gives the amd64 one (glibc 2.35).
name: Linux amd64 .deb (glibc 2.35)

on:
  # Primary: whenever a release is published, build the amd64 .deb and attach it
  # to THAT release (uses its own tag). This is the "only with a release" flow.
  release:
    types: [published]
  # Fallback: a manual button, so the .deb can be attached to an ALREADY-published
  # release (e.g. the existing v3.0) without re-releasing. Not needed for new ones.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the .deb to (manual runs only)"
        default: "v3.0"
        required: true

permissions:
  contents: write        # softprops/action-gh-release needs this to upload the asset

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04          # glibc 2.35 -> the .deb runs on 2.35 and newer
    env:
      QT_VER: "6.11.1"
      QT_PREFIX: /opt/Qt-6.11.1-static
      CC: gcc-12                     # 22.04 ships gcc 11; use 12 for Qt 6.11 (glibc stays 2.35)
      CXX: g++-12
    steps:
      - name: Install build prerequisites
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates xz-utils zstd file pkg-config \
            build-essential gcc-12 g++-12 ninja-build python3 dpkg-dev \
            libgl1-mesa-dev libfontconfig1-dev libfreetype-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev \
            libxrender-dev libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev \
            libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev \
            libxcb-icccm4-dev libxcb-sync-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-util-dev libxcb-xinerama0-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libdbus-1-dev libzstd-dev

      - name: Install a recent CMake
        # 22.04 ships CMake 3.22; building Qt 6.11 wants newer. Grab an official
        # x86_64 tarball and put it first on PATH.
        run: |
          curl -fsSL https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz \
            | tar xz -C /opt
          echo "/opt/cmake-3.31.6-linux-x86_64/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Cache static Qt
        id: qtcache
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_PREFIX }}
          key: qt-static-${{ env.QT_VER }}-ubuntu2204-amd64-dbus-v1

      - name: Build static Qt (qtbase + qtsvg)
        if: steps.qtcache.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p /qt/src && cd /qt/src
          B="https://download.qt.io/official_releases/qt/6.11/${QT_VER}/submodules"
          for m in qtbase qtsvg; do
            curl -fsSLO "$B/$m-everywhere-src-${QT_VER}.tar.xz"
            tar xf "$m-everywhere-src-${QT_VER}.tar.xz"
          done
          # Same flags as installer/make-deb.sh's companion recipe: static, D-Bus
          # ON (portal accent), xcb/xkbcommon/fontconfig forced ON so a missing
          # dev lib fails configure fast instead of building a GUI-less Qt.
          cmake -S "qtbase-everywhere-src-${QT_VER}" -B build-qtbase -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX="${QT_PREFIX}" \
            -DQT_BUILD_TESTS=OFF -DQT_BUILD_EXAMPLES=OFF \
            -DFEATURE_sql=OFF -DFEATURE_dbus=ON -DFEATURE_icu=OFF \
            -DFEATURE_xcb=ON -DFEATURE_xcb_xlib=ON \
            -DFEATURE_xkbcommon=ON -DFEATURE_xkbcommon_x11=ON \
            -DFEATURE_fontconfig=ON
          cmake --build build-qtbase --parallel
          cmake --install build-qtbase
          cmake -S "qtsvg-everywhere-src-${QT_VER}" -B build-qtsvg -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_PREFIX_PATH="${QT_PREFIX}" -DCMAKE_INSTALL_PREFIX="${QT_PREFIX}"
          cmake --build build-qtsvg --parallel
          cmake --install build-qtsvg

      - name: Build ClassBuilder (static)
        run: |
          set -eux
          cmake --preset linux-x64 --fresh -DCMAKE_PREFIX_PATH="${QT_PREFIX}"
          cmake --build --preset linux-release
          BIN=out/build/linux-x64/bin/Release/ClassBuilder
          # Gate: the whole point is no shared Qt.
          if ldd "$BIN" | grep -qi 'libQt6'; then echo "shared Qt leaked!"; ldd "$BIN" | grep -i libQt6; exit 1; fi
          echo "glibc floor: $(objdump -T "$BIN" | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1)"

      - name: Build .deb and label the glibc floor
        id: deb
        run: |
          set -eux
          bash installer/make-deb.sh
          VER="$(sed -n 's/.*set(CB_VERSION "\([^"]*\)").*/\1/p' CMakeLists.txt)"
          SRC="installer/output/classbuilder_${VER}_amd64.deb"
          DST="installer/output/classbuilder_${VER}_amd64-glibc2.35.deb"
          cp "$SRC" "$DST"
          echo "path=$DST" >> "$GITHUB_OUTPUT"
          echo "== Depends =="; dpkg-deb -f "$DST" Depends
          echo "== size ==";    du -h "$DST" | cut -f1

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          # On a release event use that release's tag; on a manual run use the input.
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          files: ${{ steps.deb.outputs.path }}
