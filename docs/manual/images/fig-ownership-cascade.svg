<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ca" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#555"/>
    </marker>
    <marker id="cd" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#c62828"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="17" font-weight="bold" fill="#111">No leaks by design — `delete pMatrix` cascades through every owned relation</text>

  <!-- top object -->
  <rect x="385" y="55" width="150" height="52" rx="6" fill="#ede7f6" stroke="#4527a0" stroke-width="2"/>
  <text x="460" y="78" font-size="14" font-weight="bold" text-anchor="middle" fill="#311b92">Matrix (top)</text>
  <text x="460" y="97" font-size="11" text-anchor="middle" fill="#555">delete pMatrix;</text>

  <!-- rows / columns -->
  <rect x="150" y="180" width="120" height="46" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="210" y="208" font-size="13" font-weight="bold" text-anchor="middle" fill="#0d47a1">Row 0</text>
  <rect x="300" y="180" width="120" height="46" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="360" y="208" font-size="13" font-weight="bold" text-anchor="middle" fill="#0d47a1">Row 1</text>
  <rect x="510" y="180" width="120" height="46" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="570" y="208" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b5e20">Column 0</text>
  <rect x="660" y="180" width="120" height="46" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="720" y="208" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b5e20">Column 1</text>

  <!-- cells -->
  <g font-size="12" font-weight="bold">
    <rect x="205" y="300" width="105" height="42" rx="6" fill="#fffde7" stroke="#9e9d24" stroke-width="1.5"/>
    <text x="257" y="326" text-anchor="middle" fill="#5d4a00">Cell r0c0</text>
    <rect x="340" y="300" width="105" height="42" rx="6" fill="#fffde7" stroke="#9e9d24" stroke-width="1.5"/>
    <text x="392" y="326" text-anchor="middle" fill="#5d4a00">Cell r0c1</text>
    <rect x="475" y="300" width="105" height="42" rx="6" fill="#fffde7" stroke="#9e9d24" stroke-width="1.5"/>
    <text x="527" y="326" text-anchor="middle" fill="#5d4a00">Cell r1c0</text>
    <rect x="610" y="300" width="105" height="42" rx="6" fill="#fffde7" stroke="#9e9d24" stroke-width="1.5"/>
    <text x="662" y="326" text-anchor="middle" fill="#5d4a00">Cell r1c1</text>
  </g>

  <!-- ownership arrows (delete flows) -->
  <path d="M420,107 L230,175" stroke="#c62828" stroke-width="2.2" fill="none" marker-end="url(#cd)"/>
  <path d="M440,107 L370,175" stroke="#c62828" stroke-width="2.2" fill="none" marker-end="url(#cd)"/>
  <path d="M480,107 L560,175" stroke="#c62828" stroke-width="2.2" fill="none" marker-end="url(#cd)"/>
  <path d="M500,107 L705,175" stroke="#c62828" stroke-width="2.2" fill="none" marker-end="url(#cd)"/>
  <text x="285" y="140" font-size="11.5" fill="#c62828">1. ~Matrix deletes owned Rows + Columns</text>

  <path d="M220,226 L250,295" stroke="#c62828" stroke-width="2.2" fill="none" marker-end="url(#cd)"/>
  <path d="M225,226 L385,296" stroke="#c62828" stroke-width="2.2" fill="none" marker-end="url(#cd)"/>
  <path d="M365,226 L520,296" stroke="#c62828" stroke-width="2.2" fill="none" marker-end="url(#cd)"/>
  <path d="M370,226 L652,297" stroke="#c62828" stroke-width="2.2" fill="none" marker-end="url(#cd)"/>
  <text x="180" y="268" font-size="11.5" fill="#c62828">2. each ~Row deletes its owned Cells</text>

  <!-- unlink arrows -->
  <path d="M545,226 L520,296" stroke="#9e9e9e" stroke-width="1.8" stroke-dasharray="6,4" fill="none" marker-end="url(#ca)"/>
  <path d="M560,226 L262,299" stroke="#9e9e9e" stroke-width="1.8" stroke-dasharray="6,4" fill="none" marker-end="url(#ca)"/>
  <path d="M710,226 L668,296" stroke="#9e9e9e" stroke-width="1.8" stroke-dasharray="6,4" fill="none" marker-end="url(#ca)"/>
  <path d="M700,226 L400,299" stroke="#9e9e9e" stroke-width="1.8" stroke-dasharray="6,4" fill="none" marker-end="url(#ca)"/>
  <text x="620" y="268" font-size="11.5" fill="#757575">3. each ~Cell unlinks itself from its Column list</text>
  <text x="620" y="283" font-size="11.5" fill="#757575">(no search — the links are its own members)</text>

  <!-- bottom explainer -->
  <rect x="30" y="375" width="860" height="80" rx="6" fill="#fafafa" stroke="#999" stroke-dasharray="5,4"/>
  <text x="45" y="400" font-size="12.5" font-weight="bold" fill="#333">The rule:</text>
  <text x="115" y="400" font-size="12.5" fill="#555">if every class is reachable from a top class through owned (aggregation) relations, destroying the top object frees the</text>
  <text x="45" y="420" font-size="12.5" fill="#555">entire object graph — DestructorInclude() runs the cascade, every destructor unlinks its object from every list it is in, and no</text>
  <text x="45" y="440" font-size="12.5" fill="#555">pointer is ever left dangling. The order is irrelevant: whichever owner dies first, the shared child unlinks from the survivor.</text>
</svg>
