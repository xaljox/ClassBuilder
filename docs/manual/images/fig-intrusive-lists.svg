<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#333"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#1565c0"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="17" font-weight="bold" fill="#111">One Cell object, two intrusive lists — the link pointers live inside the object</text>

  <!-- Row object -->
  <rect x="30" y="60" width="150" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="105" y="82" font-size="14" font-weight="bold" text-anchor="middle" fill="#0d47a1">Row (id 0)</text>
  <text x="105" y="103" font-size="12" text-anchor="middle" fill="#333">_firstCell  _lastCell</text>
  <text x="105" y="121" font-size="12" text-anchor="middle" fill="#333">_countCell = 3</text>

  <!-- Column object -->
  <rect x="30" y="330" width="150" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="105" y="352" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b5e20">Column (id 1)</text>
  <text x="105" y="373" font-size="12" text-anchor="middle" fill="#333">_firstCell  _lastCell</text>
  <text x="105" y="391" font-size="12" text-anchor="middle" fill="#333">_countCell = 2</text>

  <!-- three cells in the row list -->
  <g>
    <rect x="260" y="60" width="170" height="130" rx="6" fill="#fffde7" stroke="#9e9d24" stroke-width="1.5"/>
    <text x="345" y="82" font-size="13" font-weight="bold" text-anchor="middle" fill="#5d4a00">Cell r0c0</text>
    <text x="345" y="102" font-size="11.5" text-anchor="middle" fill="#333">CString _value</text>
    <line x1="268" y1="112" x2="422" y2="112" stroke="#bbb"/>
    <text x="345" y="130" font-size="11.5" text-anchor="middle" fill="#1565c0">_refRow  _prevRow  _nextRow</text>
    <line x1="268" y1="142" x2="422" y2="142" stroke="#bbb"/>
    <text x="345" y="160" font-size="11.5" text-anchor="middle" fill="#2e7d32">_refColumn _prevColumn _nextColumn</text>
    <text x="345" y="180" font-size="10.5" text-anchor="middle" fill="#777">links are MEMBERS of the Cell</text>
  </g>
  <g>
    <rect x="490" y="60" width="170" height="130" rx="6" fill="#fffde7" stroke="#9e9d24" stroke-width="1.5"/>
    <text x="575" y="82" font-size="13" font-weight="bold" text-anchor="middle" fill="#5d4a00">Cell r0c1</text>
    <text x="575" y="102" font-size="11.5" text-anchor="middle" fill="#333">CString _value</text>
    <line x1="498" y1="112" x2="652" y2="112" stroke="#bbb"/>
    <text x="575" y="130" font-size="11.5" text-anchor="middle" fill="#1565c0">_refRow  _prevRow  _nextRow</text>
    <line x1="498" y1="142" x2="652" y2="142" stroke="#bbb"/>
    <text x="575" y="160" font-size="11.5" text-anchor="middle" fill="#2e7d32">_refColumn _prevColumn _nextColumn</text>
  </g>
  <g>
    <rect x="720" y="60" width="170" height="130" rx="6" fill="#fffde7" stroke="#9e9d24" stroke-width="1.5"/>
    <text x="805" y="82" font-size="13" font-weight="bold" text-anchor="middle" fill="#5d4a00">Cell r0c2</text>
    <text x="805" y="102" font-size="11.5" text-anchor="middle" fill="#333">CString _value</text>
    <line x1="728" y1="112" x2="882" y2="112" stroke="#bbb"/>
    <text x="805" y="130" font-size="11.5" text-anchor="middle" fill="#1565c0">_refRow  _prevRow  _nextRow</text>
    <line x1="728" y1="142" x2="882" y2="142" stroke="#bbb"/>
    <text x="805" y="160" font-size="11.5" text-anchor="middle" fill="#2e7d32">_refColumn _prevColumn _nextColumn</text>
  </g>

  <!-- row list chain (blue) -->
  <path d="M180,100 L255,100" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#arrB)"/>
  <path d="M430,125 L485,125" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#arrB)"/>
  <path d="M485,133 L430,133" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#arrB)"/>
  <path d="M660,125 L715,125" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#arrB)"/>
  <path d="M715,133 L660,133" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#arrB)"/>
  <text x="215" y="90" font-size="11" fill="#1565c0">first</text>

  <!-- cell below in same column (green chain) -->
  <g>
    <rect x="490" y="330" width="170" height="130" rx="6" fill="#fffde7" stroke="#9e9d24" stroke-width="1.5"/>
    <text x="575" y="352" font-size="13" font-weight="bold" text-anchor="middle" fill="#5d4a00">Cell r1c1</text>
    <text x="575" y="372" font-size="11.5" text-anchor="middle" fill="#333">CString _value</text>
    <line x1="498" y1="382" x2="652" y2="382" stroke="#bbb"/>
    <text x="575" y="400" font-size="11.5" text-anchor="middle" fill="#1565c0">_refRow  _prevRow  _nextRow</text>
    <line x1="498" y1="412" x2="652" y2="412" stroke="#bbb"/>
    <text x="575" y="430" font-size="11.5" text-anchor="middle" fill="#2e7d32">_refColumn _prevColumn _nextColumn</text>
  </g>
  <path d="M180,370 C 320,370 420,180 487,163" stroke="#2e7d32" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
  <text x="300" y="330" font-size="11" fill="#2e7d32">first</text>
  <path d="M575,195 L575,325" stroke="#2e7d32" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
  <path d="M583,325 L583,195" stroke="#2e7d32" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
  <text x="595" y="262" font-size="11" fill="#2e7d32">_nextColumn / _prevColumn</text>

  <!-- contrast box -->
  <rect x="30" y="480" width="860" height="64" rx="6" fill="#fafafa" stroke="#999" stroke-dasharray="5,4"/>
  <text x="45" y="505" font-size="12.5" fill="#333" font-weight="bold">Contrast — std::list&lt;Cell*&gt;:</text>
  <text x="45" y="527" font-size="12" fill="#555">every insertion allocates a separate bucket node {prev, next, Cell*}; removal must FIND the bucket first (linear search);</text>
  <text x="45" y="543" font-size="12" fill="#555">and the Cell itself never knows which lists it is in — every membership must be tracked and cleaned up by hand.</text>
</svg>
