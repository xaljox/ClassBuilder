<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ra" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#555"/>
    </marker>
    <marker id="rr" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#c62828"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="17" font-weight="bold" fill="#111">The replace constructor:  new AndGate(pCell)  — same identity, new behaviour</text>

  <!-- BEFORE -->
  <text x="115" y="66" font-size="14" font-weight="bold" fill="#333">BEFORE</text>
  <rect x="40" y="150" width="150" height="64" rx="6" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
  <text x="115" y="177" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#263238">Cell "U7"</text>
  <text x="115" y="197" font-size="11.5" text-anchor="middle" fill="#555">(generic, from parser)</text>

  <rect x="40" y="80" width="110" height="40" rx="5" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="95" y="105" font-size="12" text-anchor="middle" fill="#0d47a1">Netlist list</text>
  <rect x="40" y="250" width="110" height="40" rx="5" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="95" y="275" font-size="12" text-anchor="middle" fill="#1b5e20">Input nets</text>
  <rect x="180" y="250" width="110" height="40" rx="5" fill="#fff3e0" stroke="#e65100"/>
  <text x="235" y="275" font-size="12" text-anchor="middle" fill="#e65100">Output net</text>

  <line x1="95" y1="120" x2="105" y2="145" stroke="#555" stroke-width="1.8" marker-end="url(#ra)"/>
  <line x1="95" y1="250" x2="105" y2="219" stroke="#555" stroke-width="1.8" marker-end="url(#ra)"/>
  <line x1="235" y1="250" x2="160" y2="217" stroke="#555" stroke-width="1.8" marker-end="url(#ra)"/>

  <!-- ARROW between panels -->
  <path d="M330,185 L560,185" stroke="#c62828" stroke-width="3" fill="none" marker-end="url(#rr)"/>
  <text x="445" y="165" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#c62828">new AndGate(pCell)</text>
  <text x="445" y="207" font-size="11.5" text-anchor="middle" fill="#c62828">takes over EVERY relation slot,</text>
  <text x="445" y="223" font-size="11.5" text-anchor="middle" fill="#c62828">then deletes the old object</text>

  <!-- AFTER -->
  <text x="685" y="66" font-size="14" font-weight="bold" fill="#333">AFTER</text>
  <rect x="610" y="150" width="150" height="64" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="685" y="177" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#b71c1c">AndGate "U7"</text>
  <text x="685" y="197" font-size="11.5" text-anchor="middle" fill="#555">(Simulate() overrides)</text>

  <rect x="610" y="80" width="110" height="40" rx="5" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="665" y="105" font-size="12" text-anchor="middle" fill="#0d47a1">Netlist list</text>
  <rect x="610" y="250" width="110" height="40" rx="5" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="665" y="275" font-size="12" text-anchor="middle" fill="#1b5e20">Input nets</text>
  <rect x="750" y="250" width="110" height="40" rx="5" fill="#fff3e0" stroke="#e65100"/>
  <text x="805" y="275" font-size="12" text-anchor="middle" fill="#e65100">Output net</text>

  <line x1="665" y1="120" x2="675" y2="145" stroke="#555" stroke-width="1.8" marker-end="url(#ra)"/>
  <line x1="665" y1="250" x2="675" y2="219" stroke="#555" stroke-width="1.8" marker-end="url(#ra)"/>
  <line x1="805" y1="250" x2="730" y2="217" stroke="#555" stroke-width="1.8" marker-end="url(#ra)"/>

  <text x="685" y="235" font-size="11" text-anchor="middle" fill="#777">same slots, same neighbours, same order</text>

  <!-- bottom explainer -->
  <rect x="30" y="330" width="860" height="128" rx="6" fill="#fafafa" stroke="#999" stroke-dasharray="5,4"/>
  <text x="45" y="356" font-size="12.5" font-weight="bold" fill="#333">Why this beats a factory:</text>
  <text x="45" y="378" font-size="12" fill="#555">A factory decides an object's class at CREATION time. The replace constructor changes it at ANY time — after the parser has built</text>
  <text x="45" y="396" font-size="12" fill="#555">the whole network with generic objects. One parser + one generic library serve many applications: replace cells with AndGate/OrGate</text>
  <text x="45" y="414" font-size="12" fill="#555">for a logic simulator, with timing-annotated variants for delay calculation, with fault-injecting variants for test-pattern generation.</text>
  <text x="45" y="440" font-size="12" fill="#8b0000">State machines work the same way: each transition replaces a State object with the subclass for the new state — an object can only do what its current state allows.</text>
</svg>
